name: Android APKs

on:
  push:
    paths:
      - "CalculatorApp/**"
      - "SmartHomeApp/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - app: CalculatorApp
            apk: Calculator.apk
          - app: SmartHomeApp
            apk: SmartHome.apk
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Build APK
        run: ${{ matrix.app }}/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}/build/${{ matrix.apk }}
