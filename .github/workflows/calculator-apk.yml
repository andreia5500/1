name: Calculator APK

on:
  push:
    paths:
      - "CalculatorApp/**"
      - ".github/workflows/calculator-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Build APK
        run: CalculatorApp/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-apk
          path: CalculatorApp/build/Calculator.apk
